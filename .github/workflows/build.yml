name: Build Android APK with Gemini AI Fixer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.6.1'

    - name: Build APK with Gradle
      run: gradle assembleDebug --continue --stacktrace 2>&1 | tee build.log

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: PatalixClock-APK
        path: "**/*.apk"
        if-no-files-found: error

    - name: Gemini AI Auto-Analysis on Failure
      if: failure()
      env:
        GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python3 -c "
        import os, urllib.request, json

        api_key = os.environ.get('GEMINI_KEY')
        if not api_key:
            print('Error: GEMINI_API_KEY secret set nahi hai!')
            exit(1)

        log_content = ''
        if os.path.exists('build.log'):
            with open('build.log', 'r', encoding='utf-8', errors='ignore') as f:
                log_content = f.read()[-3000:]

        prompt = f'Mera Android Gradle build fail ho gaya hai ya APK file nahi ban pa rahi hai. Terminal error log ye hai:\n\n{log_content}\n\nIs galti ko fix karne ke liye exact code change batayein.'

        url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}'
        payload = {'contents': [{'parts': [{'text': prompt}]}]}
        data = json.dumps(payload).encode('utf-8')

        req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'})

        try:
            response = urllib.request.urlopen(req)
            result = json.loads(response.read().decode('utf-8'))
            print('\n================ GEMINI AI ERROR SOLUTION ================')
            print(result['candidates'][0]['content']['parts'][0]['text'])
            print('==========================================================\n')
        except Exception as e:
            print('AI API Call Error:', e)
        "
